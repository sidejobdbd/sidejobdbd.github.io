<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidejob DBD - Portal Resmi</title>
  <meta name="description" content="Halaman resmi Sidejob DBD di GitHub Pages.">

  <!-- Meta Open Graph (Tampilan saat tautan dibagikan) -->
  <meta property="og:title" content="Sidejob DBD">
  <meta property="og:description" content="Portal resmi Sidejob DBD.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sidejobdbd.github.io/">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #1a1a2e;
      color: #ffffff;
      padding: 2rem 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }
    main {
      flex: 1;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
    }
    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 1.5rem;
    }
    .card h2 {
      color: #1a1a2e;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-block;
      background-color: #0f3460;
      color: #ffffff;
      padding: 0.6rem 1.2rem;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 1rem;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #e94560;
    }
    footer {
      background-color: #eef2f5;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
      border-top: 1px solid #e1e8ed;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sidejob DBD</h1>
    <p>Selamat datang di repositori utama sidejobdbd.github.io</p>
  </header>

  <main>
    <section class="card">
      <h2>Tentang Proyek</h2>
      <p>Ini adalah halaman utama untuk situs web Sidejob DBD yang di-host menggunakan GitHub Pages.</p>
      <a href="https://github.com/Changli666/sidejobdbd.github.io" class="btn" target="_blank" rel="noopener">Lihat Repositori GitHub</a>
    </section>
  </main>

  <footer>
    <p>&copy; Sidejob DBD. Dikelola melalui GitHub Pages.</p>
  </footer>

</body>
</html>
