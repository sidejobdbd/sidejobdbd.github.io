<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Game & Pembayaran</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { color: #1a1a2e; }
    
    .form-group { display: none; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: #eef2f7; padding: 15px; border-radius: 6px; }
    .form-group input { flex: 1; min-width: 140px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .form-group button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #1a1a2e; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; display: none; }
    .btn-admin { background: #0f3460; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    a { color: #007bff; text-decoration: none; word-break: break-all; }
    #loading { text-align: center; display: none; margin: 10px 0; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-flex">
    <h2>Sistem Input Data GitHub Page</h2>
    <button id="adminBtn" class="btn-admin" onclick="toggleAdmin()">Login Owner</button>
  </div>

  <!-- Form hanya muncul setelah Login -->
  <form id="dataForm" class="form-group">
    <input type="date" id="tanggal" required>
    <input type="text" id="nama" placeholder="Nama & Link Game" required>
    <input type="text" id="pembayaran" placeholder="Pembayaran" required>
    <input type="url" id="linkVideo" placeholder="Link Video (https://...)" required>
    <button type="submit">Tambah Data</button>
  </form>

  <div id="loading">Memuat Data...</div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Nama & Link Game</th>
          <th>Pembayaran</th>
          <th>Link Video</th>
          <th id="aksiHeader" style="display: none;">Aksi</th>
        </tr>
      </thead>
      <tbody id="dataTable"></tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = "https://sheetdb.io/api/v1/ly0kpmonvf4ii"; // GANTI API KEY ANDA
  const PASSWORD_ADMIN = "12345"; // GANTI KATA SANDI ANDA DI SINI

  let isAdmin = false;
  const form = document.getElementById('dataForm');
  const dataTable = document.getElementById('dataTable');
  const loading = document.getElementById('loading');

  document.addEventListener('DOMContentLoaded', loadData);

  function toggleAdmin() {
    if(!isAdmin) {
      const pass = prompt("Masukkan Kata Sandi Owner:");
      if(pass === PASSWORD_ADMIN) {
        isAdmin = true;
        document.getElementById('adminBtn').innerText = "Logout";
        form.style.display = 'flex';
        document.getElementById('aksiHeader').style.display = 'table-cell';
        loadData();
      } else if(pass !== null) {
        alert("Sandi Salah!");
      }
    } else {
      isAdmin = false;
      document.getElementById('adminBtn').innerText = "Login Owner";
      form.style.display = 'none';
      document.getElementById('aksiHeader').style.display = 'none';
      loadData();
    }
  }

  function loadData() {
    loading.style.display = 'block';
    dataTable.innerHTML = '';

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        loading.style.display = 'none';
        data.forEach(item => renderRow(item));
      });
  }

  function renderRow(item) {
    const tr = document.createElement('tr');
    const link = item['link video'] || item.linkVideo || '';
    const displayAksi = isAdmin ? 'table-cell' : 'none';
    
    tr.innerHTML = `
      <td>${item.tanggal || ''}</td>
      <td>${item.nama || ''}</td>
      <td>${item.pembayaran || ''}</td>
      <td><a href="${link}" target="_blank">Tonton Video</a></td>
      <td style="display: ${displayAksi};">
        <button class="btn-delete" style="display: inline-block;" onclick="deleteItem('${item.tanggal}')">Hapus</button>
      </td>
    `;
    dataTable.appendChild(tr);
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if(!isAdmin) return;
    loading.style.display = 'block';

    const payload = {
      data: [{
        tanggal: document.getElementById('tanggal').value,
        nama: document.getElementById('nama').value,
        pembayaran: document.getElementById('pembayaran').value,
        "link video": document.getElementById('linkVideo').value
      }]
    };

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => { form.reset(); loadData(); });
  });

  function deleteItem(tanggal) {
    if(!isAdmin || !confirm('Hapus baris ini?')) return;
    loading.style.display = 'block';
    fetch(`${API_URL}/tanggal/${tanggal}`, { method: 'DELETE' })
      .then(() => loadData());
  }
</script>

</body>
</html>
