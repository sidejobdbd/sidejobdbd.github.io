<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Data & Payment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; color: #333; }

    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

    h2 { text-align: center; margin-bottom: 20px; color: #1a1a2e; }

    .table-responsive { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }

    th, td { border: 1px solid #ddd; padding: 14px 16px; text-align: left; vertical-align: middle; word-wrap: break-word; }

    th:nth-child(1), td:nth-child(1) { width: 12%; text-align: center; } /* Date */
    th:nth-child(2), td:nth-child(2) { width: 43%; } /* Name & Game Link */
    th:nth-child(3), td:nth-child(3) { width: 30%; } /* Payment */
    th:nth-child(4), td:nth-child(4) { width: 15%; text-align: center; } /* Video Link */

    th { background-color: #1a1a2e; color: white; font-size: 14px; letter-spacing: 0.5px; }
    td { font-size: 14px; line-height: 1.5; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    tr:hover { background-color: #f1f4f9; }

    a { color: #007bff; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }

    #loading { text-align: center; display: none; margin: 15px 0; font-weight: bold; color: #555; }
  </style>
</head>
<body>

<div class="container">
  <h2>Game Data & Payment</h2>

  <div id="loading">Loading Data...</div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Name & Game Link</th>
          <th>Payment</th>
          <th>Video Link</th>
        </tr>
      </thead>
      <tbody id="dataTable"></tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = "https://sheetdb.io/api/v1/ly0kpmonvf4ii";

  const dataTable = document.getElementById('dataTable');
  const loading = document.getElementById('loading');

  document.addEventListener('DOMContentLoaded', loadData);

  function loadData() {
    loading.style.display = 'block';
    dataTable.innerHTML = '';

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        loading.style.display = 'none';
        data.forEach(item => renderRow(item));
      })
      .catch(error => {
        loading.style.display = 'none';
        console.error('Error:', error);
      });
  }

  // Treat several common "no link" tokens as empty
  const NO_LINK_TOKENS = new Set(['-', '.', 'not yet', 'n/a', 'na', 'none', '']);

  // Normalize and validate a URL. Returns a valid absolute url string or ''.
  function normalizeLink(raw) {
    if (!raw && raw !== 0) return '';
    let s = String(raw).trim();
    if (!s) return '';

    const low = s.toLowerCase();
    if (NO_LINK_TOKENS.has(low)) return '';

    // If someone entered only the YouTube id or something short, we don't attempt to transform it
    // but we do handle "www.example.com" by adding https://
    if (s.startsWith('www.')) {
      s = 'https://' + s;
    }

    // If the value looks like 'youtu.be/xyz' without protocol, add https://
    if (/^youtu\.be\//i.test(s)) {
      s = 'https://' + s;
    }

    // If it doesn't start with http/https, treat as invalid
    if (!/^https?:\/\//i.test(s)) {
      return '';
    }

    // Validate with URL constructor
    try {
      const u = new URL(s);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
      return u.toString();
    } catch (e) {
      return '';
    }
  }

  // Simple HTML-escape to avoid accidental injection from sheet contents
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderRow(item) {
    const tr = document.createElement('tr');

    const date = escapeHtml(item.date || item.tanggal || '');
    const name = escapeHtml(item.name || item.nama || '');
    const payment = escapeHtml(item.payment || item.pembayaran || '');

    // Accept multiple possible column names
    const rawLink = item['video link'] ?? item.videoLink ?? item['link video'] ?? item.linkVideo ?? item.link ?? '';
    const link = normalizeLink(rawLink);

    const linkCell = link
      ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">Watch Video</a>`
      : '-';

    tr.innerHTML = `
      <td style="text-align: center;">${date}</td>
      <td>${name}</td>
      <td>${payment}</td>
      <td style="text-align: center;">${linkCell}</td>
    `;
    dataTable.appendChild(tr);
  }
</script>

</body>
</html>
