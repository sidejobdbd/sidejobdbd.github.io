<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Data & Payment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-bottom: 20px; color: #1a1a2e; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #1a1a2e; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    a { color: #007bff; text-decoration: none; word-break: break-all; }
    a:hover { text-decoration: underline; }
    #loading { text-align: center; display: none; margin: 10px 0; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>Game Data & Payment</h2>

  <div id="loading">Loading Data...</div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Name & Game Link</th>
          <th>Payment</th>
          <th>Video Link</th>
        </tr>
      </thead>
      <tbody id="dataTable"></tbody>
    </table>
  </div>
</div>

<script>
  const API_URL = "https://sheetdb.io/api/v1/ly0kpmonvf4ii";

  const dataTable = document.getElementById('dataTable');
  const loading = document.getElementById('loading');

  document.addEventListener('DOMContentLoaded', loadData);

  function loadData() {
    loading.style.display = 'block';
    dataTable.innerHTML = '';

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        loading.style.display = 'none';
        data.forEach(item => renderRow(item));
      })
      .catch(error => {
        loading.style.display = 'none';
        console.error('Error:', error);
      });
  }

  function renderRow(item) {
    const tr = document.createElement('tr');
    // Memeriksa variabel bahasa Inggris serta backward-compatibility dengan kunci lama
    const date = item.date || item.tanggal || '';
    const name = item.name || item.nama || '';
    const payment = item.payment || item.pembayaran || '';
    const link = item['video link'] || item.videoLink || item['link video'] || item.linkVideo || '';
    
    tr.innerHTML = `
      <td>${date}</td>
      <td>${name}</td>
      <td>${payment}</td>
      <td>${link ? `<a href="${link}" target="_blank" rel="noopener">Watch Video</a>` : '-'}</td>
    `;
    dataTable.appendChild(tr);
  }
</script>

</body>
</html>
