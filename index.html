<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Game & Pembayaran</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-bottom: 20px; color: #1a1a2e; }
    
    .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .form-group input { flex: 1; min-width: 140px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .form-group button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .form-group button:hover { background: #218838; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #1a1a2e; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn-delete:hover { background: #c82333; }
    a { color: #007bff; text-decoration: none; word-break: break-all; }
    a:hover { text-decoration: underline; }
    #loading { text-align: center; display: none; margin: 10px 0; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>Sistem Input Data GitHub Page</h2>

  <form id="dataForm" class="form-group">
    <input type="date" id="tanggal" required>
    <input type="text" id="nama" placeholder="Nama & Link Game" required>
    <input type="text" id="pembayaran" placeholder="Pembayaran" required>
    <input type="url" id="linkVideo" placeholder="Link Video (https://...)" required>
    <button type="submit" id="submitBtn">Tambah Data</button>
  </form>

  <div id="loading">Memuat & Memproses Data...</div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Nama & Link Game</th>
          <th>Pembayaran</th>
          <th>Link Video</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="dataTable">
      </tbody>
    </table>
  </div>
</div>

<script>
  // GANTI URL DI BAWAH DENGAN URL API DARI SHEETDB
  const API_URL = "https://sheetdb.io/api/v1/ly0kpmonvf4ii";

  const form = document.getElementById('dataForm');
  const dataTable = document.getElementById('dataTable');
  const loading = document.getElementById('loading');

  document.addEventListener('DOMContentLoaded', loadData);

  // Ambil Data dari Google Sheets
  function loadData() {
    loading.style.display = 'block';
    dataTable.innerHTML = '';

    fetch(API_URL)
      .then(response => response.json())
      .then(data => {
        loading.style.display = 'none';
        data.forEach(item => renderRow(item));
      })
      .catch(error => {
        loading.style.display = 'none';
        console.error('Error:', error);
      });
  }

  // Tambah Data ke Google Sheets
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    loading.style.display = 'block';

    const payload = {
      data: [{
        tanggal: document.getElementById('tanggal').value,
        nama: document.getElementById('nama').value,
        pembayaran: document.getElementById('pembayaran').value,
        "link video": document.getElementById('linkVideo').value
      }]
    };

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(() => {
      form.reset();
      loadData();
    })
    .catch(error => {
      loading.style.display = 'none';
      alert('Gagal menambah data');
      console.error(error);
    });
  });

  // Tampilkan ke Tabel HTML
  function renderRow(item) {
    const tr = document.createElement('tr');
    // Menyesuaikan kunci objek 'link video' yang ada spasi sesuai gambar kolom D
    const link = item['link video'] || item.linkVideo || '';
    
    tr.innerHTML = `
      <td>${item.tanggal || ''}</td>
      <td>${item.nama || ''}</td>
      <td>${item.pembayaran || ''}</td>
      <td><a href="${link}" target="_blank" rel="noopener">Tonton Video</a></td>
      <td><button class="btn-delete" onclick="deleteItem('${item.tanggal}')">Hapus</button></td>
    `;
    dataTable.appendChild(tr);
  }

  // Hapus Data dari Google Sheets berdasarkan Tanggal
  function deleteItem(tanggal) {
    if(!confirm('Apakah Anda yakin ingin menghapus data tanggal ini?')) return;
    
    loading.style.display = 'block';
    fetch(`${API_URL}/tanggal/${tanggal}`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(() => {
      loadData();
    })
    .catch(error => {
      loading.style.display = 'none';
      alert('Gagal menghapus data');
      console.error(error);
    });
  }
</script>

</body>
</html>
